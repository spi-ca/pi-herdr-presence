name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: locked baseline
            bun-version: 1.3.14
            pi-version: ""
            pi-graph: '{"@earendil-works/pi-agent-core":"0.84.4","@earendil-works/pi-ai":"0.84.4","@earendil-works/pi-client":"0.84.4","@earendil-works/pi-coding-agent":"0.84.4","@earendil-works/pi-protocol":"0.84.4","@earendil-works/pi-telemetry":"0.84.4","@earendil-works/pi-tui":"0.84.4"}'
          - lane: current compatibility
            bun-version: 1.4.2
            pi-version: 0.85.1
            pi-graph: '{"@earendil-works/pi-agent-core":"0.85.1","@earendil-works/pi-ai":"0.85.1","@earendil-works/pi-client":"0.85.1","@earendil-works/pi-coding-agent":"0.85.1","@earendil-works/pi-protocol":"0.85.1","@earendil-works/pi-telemetry":"0.85.1","@earendil-works/pi-tui":"0.85.1"}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Report selected toolchain
        run: |
          set -euo pipefail
          test "$(bun --version)" = "${{ matrix.bun-version }}"
          bun --version
          command -v cc
          cc --version
      - name: Install locked baseline
        if: matrix.pi-version == ''
        run: bun install --frozen-lockfile
      - name: Install selected Pi compatibility graph
        if: matrix.pi-version != ''
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.json.original"
          bun -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const names = Object.keys(pkg.devDependencies ?? {}).filter((name) => name.startsWith("@earendil-works/pi-"));
            if (names.length === 0) throw new Error("no declared Pi development packages");
            for (const name of names) pkg.devDependencies[name] = process.env.PI_VERSION;
            writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          '
          rm -rf node_modules
          bun install --no-save
      - name: Verify complete selected Pi version graph
        env:
          PI_GRAPH_EXPECTED: ${{ matrix.pi-graph }}
        run: bun .github/scripts/verify-pi-graph.ts
      - name: Self-test CI assertion helpers
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='${{ matrix.pi-graph }}' PI_OFFLINE=1 bun .github/scripts/verify-pi-graph.ts --self-test
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='${{ matrix.pi-graph }}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts --self-test
      - name: Assert installed extension registration without install
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='${{ matrix.pi-graph }}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts --existing
      - name: Verify
        run: bun run ci
      - name: Inspect package contents
        run: bun pm pack --dry-run
      - name: Tarball install and registration smoke (provider-free)
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='${{ matrix.pi-graph }}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts
      - name: Confirm compatibility install was ephemeral
        if: always() && matrix.pi-version != ''
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/package.json.original"
          mv "$RUNNER_TEMP/package.json.original" package.json
          git diff --exit-code -- package.json bun.lock
